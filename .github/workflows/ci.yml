name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon
          POSTGRES_DB: neon_syndicate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      {
        DATABASE_URL: 'postgresql://neon:neon@localhost:5432/neon_syndicate?schema=public',
        DIRECT_URL: 'postgresql://neon:neon@localhost:5432/neon_syndicate?schema=public',
        REDIS_URL: 'redis://localhost:6379',
      }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24.14.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm verify
      - run: pnpm --filter @neon/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
